# Test workflow to check if pinning pnpm version fixes arm64 build

name: Test Supernova Build - Pinned pnpm

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/test-supernova-pinned-pnpm.yaml'
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: "juno-app-supernova-test"
  PACKAGE_PATH: "apps/supernova"

jobs:
  test-build-pinned-pnpm:
    name: Test Build with pnpm@11.25.0
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create test Dockerfile with pinned pnpm
        run: |
          cat > apps/supernova/docker/Dockerfile.pinnedpnpm << 'EOF'
          # SPDX-FileCopyrightText: 2024 SAP SE or an SAP affiliate company and Juno contributors
          # SPDX-License-Identifier: Apache-2.0

          FROM node:22-alpine AS build

          LABEL org.opencontainers.image.source=https://github.com/cloudoperators/juno/tree/main/apps/supernova
          LABEL org.opencontainers.image.description="This image contains a standalone runnable version of the Supernova alternative Alertmanager UI. For configuration options see the README here: https://github.com/cloudoperators/juno/tree/main/apps/supernova/docker"
          LABEL org.opencontainers.image.licenses=Apache-2.0

          WORKDIR /app

          ADD . .
          # Pin pnpm version to match package.json packageManager field
          RUN npm i -g pnpm@11.25.0

          RUN pnpm install && pnpx turbo build:static --filter @cloudoperators/juno-app-supernova

          FROM nginx:alpine
          # we need to install jq, cause it is used in the entrypoint.sh
          RUN apk add --no-cache jq && apk upgrade --no-cache --no-progress

          WORKDIR /usr/share/nginx/html

          ENV THEME=""
          ENV ENDPOINT=""
          ENV FILTER_LABELS=""
          ENV SILENCE_EXCLUDED_LABELS=""
          ENV SILENCE_TEMPLATES=""
          ENV PREDEFINED_FILTERS=""

          # default appProps.json
          RUN cat <<EOFINNER > /appProps.json
          {
            "endpoint": "",
            "theme": "theme-dark",
            "embedded": false,
            "silenceExcludedLabels": "",
            "silenceTemplates": ""
          }
          EOFINNER

          COPY --from=build /app/apps/supernova/build /usr/share/nginx/html/

          COPY apps/greenhouse/docker/nginx.conf /etc/nginx/conf.d/default.conf
          COPY apps/greenhouse/docker/entrypoint.sh /usr/local/bin/entrypoint.sh

          RUN chmod +x /usr/local/bin/entrypoint.sh

          ENTRYPOINT [ "/usr/local/bin/entrypoint.sh" ]

          # Define the default command to run (could be overridden)
          CMD ["nginx", "-g", "daemon off;"]
          EOF

      # Add support for more platforms with QEMU
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      # Set up BuildKit Docker container builder
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          driver-opts: |
            image=moby/buildkit:latest

      # Build arm64 with pinned pnpm
      - name: Build Docker image - arm64 with pnpm@11.25.0
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ env.PACKAGE_PATH }}/docker/Dockerfile.pinnedpnpm
          push: false
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:test-pinned-pnpm-arm64
          platforms: linux/arm64
          outputs: type=image,push=false

      - name: Build result
        if: success()
        run: echo "✅ Pinned pnpm@11.25.0 succeeded!"

      - name: Build failed
        if: failure()
        run: echo "❌ Pinned pnpm@11.25.0 also failed"
