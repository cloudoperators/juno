name: Release

on:
  push:
    branches:
      - main

env:
  HUSKY: 0
  NODE_VERSION: "26.13.0"

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write # required for npm trusted publishing via OIDC

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    environment: npm-publish
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      publishedPackages: ${{ steps.changesets.outputs.publishedPackages }}
    steps:
      - name: Generate GitHub App Token
        id: github-app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.CLOUDOPERATOR_APP_ID }}
          private-key: ${{ secrets.CLOUDOPERATOR_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11.5.1

      - name: Setup pnpm via Corepack
        run: |
          corepack enable
          corepack prepare --activate
        shell: bash

      - name: Cache \ store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile && pnpm build

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        env:
          GITHUB_TOKEN: ${{ steps.github-app-token.outputs.token }}
          GH_TOKEN: ${{ steps.github-app-token.outputs.token }}
          PR_TITLE: "publish(npm): automate Package Versioning and Publishing with Changesets"
          COMMIT_MESSAGE: "chore(version): update versions with Changesets"
          VERSION_BRANCH: changeset-release/main
        run: |
          set -euo pipefail
          git config user.name "cloud-operator-bot[bot]"
          git config user.email "cloud-operator-bot[bot]@users.noreply.github.com"
          # Push via the GitHub App token so pushed branches and tags trigger CI.
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          # Any changeset markdown other than the README means there are pending releases.
          pending="$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | head -n 1 || true)"

          if [ -n "$pending" ]; then
            echo "Pending changesets detected - creating or updating the version PR."
            pnpm changeset version
            git checkout -B "$VERSION_BRANCH"
            git add -A
            git commit -m "$COMMIT_MESSAGE"
            git push --force origin "$VERSION_BRANCH"

            existing="$(gh pr list --head "$VERSION_BRANCH" --state open --json number --jq '.[0].number // empty')"
            if [ -z "$existing" ]; then
              gh pr create --base main --head "$VERSION_BRANCH" \
                --title "$PR_TITLE" \
                --body "Automated by the release workflow. Merging this PR versions the packages and publishes them to npm."
            fi

            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "publishedPackages=[]" >> "$GITHUB_OUTPUT"
          else
            echo "No pending changesets - publishing to npm."
            before="$(git tag | sort -u)"
            pnpm release
            after="$(git tag | sort -u)"

            # Git tags created by `changeset publish` identify the packages it published.
            new_tags="$(comm -13 <(printf '%s\n' "$before") <(printf '%s\n' "$after") | grep -v '^$' || true)"

            if [ -n "$new_tags" ]; then
              git push --tags origin
              packages_json="$(printf '%s\n' "$new_tags" | node -e '
                const tags = require("fs").readFileSync(0, "utf8").split("\n").filter(Boolean)
                const pkgs = tags.map((tag) => {
                  const at = tag.lastIndexOf("@")
                  return { name: tag.slice(0, at), version: tag.slice(at + 1) }
                })
                process.stdout.write(JSON.stringify(pkgs))
              ')"
              echo "published=true" >> "$GITHUB_OUTPUT"
              echo "publishedPackages=$packages_json" >> "$GITHUB_OUTPUT"
            else
              echo "published=false" >> "$GITHUB_OUTPUT"
              echo "publishedPackages=[]" >> "$GITHUB_OUTPUT"
            fi
          fi

  format-published-packages:
    if: needs.release.outputs.published == 'true'
    needs: [release]
    runs-on: ubuntu-latest
    outputs:
      message: ${{ steps.format.outputs.message }}
    steps:
      - name: Format published packages list
        id: format
        env:
          PACKAGES: ${{ needs.release.outputs.publishedPackages }}
        run: |
          MESSAGE=$(echo "$PACKAGES" | jq -r '[.[] | "\(.name)@\(.version)"] | join(", ")')
          echo "message=$MESSAGE" >> "$GITHUB_OUTPUT"

  notify-on-success:
    if: needs.release.outputs.published == 'true'
    needs: [release, format-published-packages]
    uses: cloudoperators/juno/.github/workflows/shared-slack-notification.yaml@5cacb59856fa112604bb50bd0de94356c56d2c82 # main
    with:
      title: "JUNO Packages Released Successfully! 🚀"
      body: ${{ needs.format-published-packages.outputs.message }}
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  notify-on-failure:
    if: failure()
    needs: [release]
    uses: cloudoperators/juno/.github/workflows/shared-slack-notification.yaml@5cacb59856fa112604bb50bd0de94356c56d2c82 # main
    with:
      title: "🚨 JUNO Packages Release Failed 🚨"
      body: "An error occurred while releasing JUNO Packages for the branch ${{ github.head_ref || github.ref_name }}. Please check the logs for more information. <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Check the logs>"
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
