name: Release

on:
  push:
    branches:
      - main

env:
  HUSKY: 0
  NODE_VERSION: "26.13.0"

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: write
      pull-requests: write
      id-token: write # required for npm trusted publishing via OIDC
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      publishedPackages: ${{ steps.changesets.outputs.publishedPackages }}
    steps:
      - name: Generate GitHub App Token
        id: github-app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.CLOUDOPERATOR_APP_ID }}
          private-key: ${{ secrets.CLOUDOPERATOR_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11.5.1

      - name: Setup pnpm via Corepack
        run: |
          corepack enable
          corepack prepare --activate
        shell: bash

      - name: Cache \ store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile && pnpm build

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_TITLE: "publish(npm): automate Package Versioning and Publishing with Changesets"
          COMMIT_MESSAGE: "chore(version): update versions with Changesets"
        with:
          # The GitHub App token makes the API commit, so GitHub signs it as the
          # App identity ("Verified") — matching the old changesets/action behaviour
          # and satisfying the "require signed commits" branch protection.
          github-token: ${{ steps.github-app-token.outputs.token }}
          script: |
            const { execSync } = require("node:child_process")
            const fs = require("node:fs")

            const { owner, repo } = context.repo
            // changeset version/publish read .changeset/config.json themselves; the
            // branch name follows the triggering branch, exactly like changesets/action.
            const baseBranch = context.ref.replace("refs/heads/", "")
            const versionBranch = `changeset-release/${baseBranch}`
            const prTitle = process.env.PR_TITLE
            const commitMessage = process.env.COMMIT_MESSAGE
            const baseSha = context.sha

            // Any changeset markdown other than the README means there are pending releases.
            const pending = fs
              .readdirSync(".changeset")
              .filter((file) => file.endsWith(".md") && file.toLowerCase() !== "readme.md")

            if (pending.length > 0) {
              core.info(`Found ${pending.length} pending changeset(s); creating the version commit.`)
              execSync("pnpm changeset version", { stdio: "inherit" })

              // Collect the working-tree changes as a GraphQL file-change set.
              execSync("git add -A")
              const records = execSync("git diff --cached --name-status -z", { encoding: "utf8" })
                .split("\0")
                .filter(Boolean)
              const additions = []
              const deletions = []
              for (let i = 0; i < records.length; ) {
                const status = records[i++]
                if (status.startsWith("R")) {
                  deletions.push({ path: records[i++] })
                  const newPath = records[i++]
                  additions.push({ path: newPath, contents: fs.readFileSync(newPath).toString("base64") })
                } else if (status === "D") {
                  deletions.push({ path: records[i++] })
                } else {
                  const filePath = records[i++]
                  additions.push({ path: filePath, contents: fs.readFileSync(filePath).toString("base64") })
                }
              }

              // Point the version branch at the current main commit before committing on top.
              try {
                await github.rest.git.getRef({ owner, repo, ref: `heads/${versionBranch}` })
                await github.rest.git.updateRef({ owner, repo, ref: `heads/${versionBranch}`, sha: baseSha, force: true })
              } catch (error) {
                if (error.status === 404) {
                  await github.rest.git.createRef({ owner, repo, ref: `refs/heads/${versionBranch}`, sha: baseSha })
                } else {
                  throw error
                }
              }

              await github.graphql(
                `mutation ($input: CreateCommitOnBranchInput!) {
                  createCommitOnBranch(input: $input) { commit { oid } }
                }`,
                {
                  input: {
                    branch: { repositoryNameWithOwner: `${owner}/${repo}`, branchName: versionBranch },
                    message: { headline: commitMessage },
                    expectedHeadOid: baseSha,
                    fileChanges: { additions, deletions },
                  },
                }
              )

              const open = await github.rest.pulls.list({ owner, repo, base: baseBranch, head: `${owner}:${versionBranch}`, state: "open" })
              if (open.data.length === 0) {
                await github.rest.pulls.create({
                  owner,
                  repo,
                  base: baseBranch,
                  head: versionBranch,
                  title: prTitle,
                  body: "Automated by the release workflow. Merging this PR versions the packages and publishes them to npm.",
                })
              }

              core.setOutput("published", "false")
              core.setOutput("publishedPackages", "[]")
              return
            }

            core.info("No pending changesets; publishing to npm.")
            const tagsBefore = new Set(execSync("git tag", { encoding: "utf8" }).split("\n").filter(Boolean))
            execSync("pnpm release", { stdio: "inherit" })
            const newTags = execSync("git tag", { encoding: "utf8" })
              .split("\n")
              .filter(Boolean)
              .filter((tag) => !tagsBefore.has(tag))

            if (newTags.length === 0) {
              core.setOutput("published", "false")
              core.setOutput("publishedPackages", "[]")
              return
            }

            // Publish the tags `changeset publish` created locally through the API.
            for (const tag of newTags) {
              const sha = execSync(`git rev-list -n 1 "${tag}"`, { encoding: "utf8" }).trim()
              try {
                await github.rest.git.createRef({ owner, repo, ref: `refs/tags/${tag}`, sha })
              } catch (error) {
                if (error.status !== 422) {
                  core.warning(`Could not create tag ${tag}: ${error.message}`)
                }
              }
            }

            const publishedPackages = newTags.map((tag) => {
              const at = tag.lastIndexOf("@")
              return { name: tag.slice(0, at), version: tag.slice(at + 1) }
            })
            core.setOutput("published", "true")
            core.setOutput("publishedPackages", JSON.stringify(publishedPackages))

  format-published-packages:
    if: needs.release.outputs.published == 'true'
    needs: [release]
    runs-on: ubuntu-latest
    outputs:
      message: ${{ steps.format.outputs.message }}
    steps:
      - name: Format published packages list
        id: format
        env:
          PACKAGES: ${{ needs.release.outputs.publishedPackages }}
        run: |
          MESSAGE=$(echo "$PACKAGES" | jq -r '[.[] | "\(.name)@\(.version)"] | join(", ")')
          echo "message=$MESSAGE" >> "$GITHUB_OUTPUT"

  notify-on-success:
    if: needs.release.outputs.published == 'true'
    needs: [release, format-published-packages]
    uses: cloudoperators/juno/.github/workflows/shared-slack-notification.yaml@5cacb59856fa112604bb50bd0de94356c56d2c82 # main
    with:
      title: "JUNO Packages Released Successfully! 🚀"
      body: ${{ needs.format-published-packages.outputs.message }}
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  notify-on-failure:
    if: failure()
    needs: [release]
    uses: cloudoperators/juno/.github/workflows/shared-slack-notification.yaml@5cacb59856fa112604bb50bd0de94356c56d2c82 # main
    with:
      title: "🚨 JUNO Packages Release Failed 🚨"
      body: "An error occurred while releasing JUNO Packages for the branch ${{ github.head_ref || github.ref_name }}. Please check the logs for more information. <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Check the logs>"
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
