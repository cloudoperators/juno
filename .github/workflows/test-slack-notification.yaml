name: Test Slack Notification

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/release.yaml'
      - '.github/workflows/shared-slack-notification.yaml'
      - '.github/workflows/test-slack-notification.yaml'
  workflow_dispatch:

jobs:
  test-notification:
    runs-on: ubuntu-latest
    steps:
      - name: Set test data
        id: data
        run: |
          # Use mock release data to test the notification
          echo 'data=[{"name":"@cloudoperators/juno-ui-components","version":"3.0.0"},{"name":"@cloudoperators/juno-communicator","version":"2.1.0"}]' >> $GITHUB_OUTPUT

      - name: Debug test data
        run: |
          echo "Test data: $DATA"
          echo "Test data length: ${#DATA}"
          echo "GitHub ref: ${{ github.ref }}"
          echo "GitHub SHA: ${{ github.sha }}"
        env:
          DATA: ${{ steps.data.outputs.data }}
    outputs:
      test_data: ${{ steps.data.outputs.data }}

  call-shared-workflow:
    needs: [test-notification]
    uses: cloudoperators/juno/.github/workflows/shared-slack-notification.yaml@main
    with:
      title: "🧪 TEST: JUNO Slack Notification (PR #${{ github.event.pull_request.number || 'manual' }})"
      body: ${{ needs.test-notification.outputs.test_data }}
      rich_body: false
      environment: notifications
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
