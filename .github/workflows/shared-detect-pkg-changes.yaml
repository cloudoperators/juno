# Run it locally with act (https://github.com/nektos/act)
#  1. Install act:
#     `brew install act`
#  2. Create a .secret file with the following content:
#     `GITHUB_TOKEN=your_github_token`
#  PULL REQUEST
#  1. Create a act_pull_request.json file in case of a pull request with the following content:
#     `{"inputs": {"paths": "packages/juno-ui-components apps/exampleapp", "node": "20.x", "runs-on": "ubuntu-latest"}}`
#  2. Run the following command:
#     `act workflow_call -e act_workflow_call_ci.json -W .github/workflows/check-changes-npm-package.yaml`

name: Detect Changes on the given Paths or Folders

on:
  workflow_call:
    inputs:
      paths:
        description: "Space separated list of paths indicating where to collect packages to be check for changes. Example: 'packages' will check all packages in the packages folder."
        required: false
        type: string
      folders:
        description: "Space-separated list of folders to be checked for changes. Example: 'packages/communicator packages/juno-ui-components' checks for changes in the communicator and juno-ui-components packages. You can use wildcards to check all packages within a specific folder. Example: '*/ui' checks all packages with a ui folder at the second level."
        required: false
        type: string
      runs-on:
        description: "The runner to use for the job"
        required: false
        default: "ubuntu-latest"
        type: string
    outputs:
      changes:
        description: "List of found changes in the paths"
        value: ${{ jobs.detect-changes.outputs.changes }}

permissions:
  contents: read
  pull-requests: read

jobs:
  detect-changes:
    runs-on: ${{ inputs.runs-on}}
    outputs:
      changes: ${{ steps.package-filters.outputs.changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect changed packages
        id: package-filters
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v8.0.0
        env:
          INPUT_PATHS: ${{ inputs.paths }}
          INPUT_FOLDERS: ${{ inputs.folders }}
        with:
          script: |
            const fs = require("node:fs")

            const paths = (process.env.INPUT_PATHS || "").split(/\s+/).filter(Boolean)
            const folders = (process.env.INPUT_FOLDERS || "").split(/\s+/).filter(Boolean)

            // Candidate packages: every immediate subdirectory of each input path,
            // plus any explicitly listed folders. Mirrors the previous "path/*" expansion.
            const candidates = new Set(folders)
            for (const root of paths) {
              let entries = []
              try {
                entries = fs.readdirSync(root, { withFileTypes: true })
              } catch {
                continue
              }
              for (const entry of entries) {
                if (entry.isDirectory()) candidates.add(`${root}/${entry.name}`)
              }
            }

            // Collect the files changed by this event.
            let changedFiles = []
            const pr = context.payload.pull_request
            if (pr) {
              const files = await github.paginate(github.rest.pulls.listFiles, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                per_page: 100,
              })
              changedFiles = files.map((file) => file.filename)
            } else if (context.payload.before && context.payload.after) {
              const { data } = await github.rest.repos.compareCommits({
                owner: context.repo.owner,
                repo: context.repo.repo,
                base: context.payload.before,
                head: context.payload.after,
              })
              changedFiles = (data.files || []).map((file) => file.filename)
            }

            // A candidate counts as changed if any changed file sits inside it.
            const changed = [...candidates].filter((folder) =>
              changedFiles.some((file) => file === folder || file.startsWith(`${folder}/`))
            )

            core.info(`Changed packages: ${JSON.stringify(changed)}`)
            core.setOutput("changes", JSON.stringify(changed))
