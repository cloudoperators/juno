name: CI Check Title

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: read

jobs:
  title-lint:
    name: Validate PR title
    runs-on: [ubuntu-latest]
    # skip if the PR is from a forked repository
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate PR title
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v8.0.0
        with:
          script: |
            const path = require("node:path")
            const { pathToFileURL } = require("node:url")

            // Load the shared conventional-commit rules so the workflow stays in
            // sync with commitlint (local validation) without duplicating the lists.
            const configUrl = pathToFileURL(path.join(process.env.GITHUB_WORKSPACE, "commitlint.config.mjs")).href
            const { types, scopes } = await import(configUrl)

            const pr = context.payload.pull_request
            const title = pr.title || ""
            const labels = (pr.labels || []).map((label) => label.name)

            const ignoreLabels = ["bot", "ignore-semantic-pull-request"]
            if (labels.some((label) => ignoreLabels.includes(label))) {
              core.info(`Skipping validation: PR carries an ignore label (${ignoreLabels.join(", ")}).`)
              return
            }

            // WIP titles are allowed to pass while the PR is still in progress.
            if (/^wip\b/i.test(title)) {
              core.info(`Skipping validation: title marked as work in progress.`)
              return
            }

            const headerPattern = /^(\w*)(?:\(([\w$.\-*/ ]*)\))?: (.*)$/
            const match = title.match(headerPattern)
            if (!match) {
              core.setFailed(`PR title "${title}" must follow "type(scope): subject".`)
              return
            }

            const [, type, rawScope, subject] = match

            if (!types.includes(type)) {
              core.setFailed(`Type "${type}" is not allowed. Allowed types: ${types.join(", ")}.`)
              return
            }

            if (!rawScope) {
              core.setFailed(`A scope is required: use "type(scope): subject".`)
              return
            }

            const describeScopes = () =>
              scopes.map((scope) => (scope instanceof RegExp ? scope.toString() : scope)).join(", ")

            // Disallowed scope patterns, matched against the whole scope: `release`
            // is reserved and fully-uppercase scopes (e.g. "UI", "API") are rejected.
            const disallowScopes = [/^release$/, /^[A-Z]+$/]
            for (const scope of rawScope.split(/[\s,/]+/).filter(Boolean)) {
              if (disallowScopes.some((pattern) => pattern.test(scope))) {
                core.setFailed(`Scope "${scope}" is not allowed (matches a disallowed pattern).`)
                return
              }
              const allowed = scopes.some((allowedScope) =>
                allowedScope instanceof RegExp ? allowedScope.test(scope) : allowedScope === scope
              )
              if (!allowed) {
                core.setFailed(`Scope "${scope}" is not allowed. Allowed scopes: ${describeScopes()}.`)
                return
              }
            }

            if (/^[A-Z]/.test(subject)) {
              core.setFailed(`Subject "${subject}" must not start with an uppercase character.`)
              return
            }

            core.info(`PR title "${title}" is valid.`)
