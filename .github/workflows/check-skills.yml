# check-skills.yml — copied by `intent maintainer setup` into .github/workflows/
#
# Validates intent skills and recorded source reviews on pull requests.
# Only runs when files relevant to skills are changed (skill sources, component
# sources tracked in review-state.json, or intent artifacts).
#
# The steps live in TanStack/intent's reusable workflows, pinned below to the
# commit of the Intent release that copied this file. Dependabot and Renovate
# bump the pin like any other action reference; a `github-actions` entry in
# .github/dependabot.yml is enough.
#
# intent-workflow-version: 6

name: Check Skills

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - 'packages/ui-components/skills/**'
      - 'packages/ui-components/src/components/**'
      - '_artifacts/**'
      - '.intent/**'
  workflow_dispatch: {}

permissions: {}

jobs:
  setup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      node-version: ${{ steps.versions.outputs.node-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read node version from .nvmrc
        id: versions
        run: echo "node-version=$(cat .nvmrc)" >> $GITHUB_OUTPUT

  validate:
    needs: setup
    name: Validate intent skills
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      INTENT_ARTIFACTS: _artifacts
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm via Corepack
        run: corepack enable
        shell: bash

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ needs.setup.outputs.node-version }}
          cache: pnpm

      - name: Install intent
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          if [ ! -e node_modules/.bin/intent ]; then
            echo "::error::@tanstack/intent is not installed. Add it to devDependencies so CI runs the pinned version."
            exit 1
          fi
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Prepare repairs
        id: repairs
        continue-on-error: true
        run: |
          DIRECTORY=$(mktemp -d "$RUNNER_TEMP/intent-repairs.XXXXXX")
          echo "directory=$DIRECTORY" >> "$GITHUB_OUTPUT"
          git -c core.fsmonitor=false rev-parse HEAD > "$DIRECTORY/base-sha.txt"
          if [ -n "$(git -c core.fsmonitor=false status --porcelain --untracked-files=all)" ]; then
            echo "::error::Repair patches require a clean checkout after dependency installation."
            exit 1
          fi
          status=0
          intent repair --write --json > "$DIRECTORY/repair-report.json" || status=1
          intent maintainer sync --artifacts "$INTENT_ARTIFACTS" > "$DIRECTORY/sync.log" 2>&1 || status=1
          # Stage newly generated manifests into the patch without committing them.
          git -c core.fsmonitor=false add --intent-to-add -- .
          git -c core.fsmonitor=false diff --no-ext-diff --no-textconv --binary HEAD > "$DIRECTORY/mechanical.patch"
          intent repair --patch > "$DIRECTORY/example-suggestions.patch" || status=1
          if [ -s "$DIRECTORY/mechanical.patch" ]; then
            echo "pending=true" >> "$GITHUB_OUTPUT"
          fi
          exit "$status"

      - name: Check skills
        env:
          INTENT_REVIEW_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          intent maintainer check --base "$INTENT_REVIEW_BASE" --github-summary --artifacts "$INTENT_ARTIFACTS"

      - name: Save repair patches
        if: always() && steps.repairs.outputs.directory != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: intent-repairs
          path: ${{ steps.repairs.outputs.directory }}
          if-no-files-found: error
          retention-days: 7

      - name: Require repair review
        if: always() && steps.repairs.outcome != 'skipped'
        env:
          REPAIR_PENDING: ${{ steps.repairs.outputs.pending }}
          REPAIR_OUTCOME: ${{ steps.repairs.outcome }}
        run: |
          if [ "$REPAIR_PENDING" = true ] || [ "$REPAIR_OUTCOME" != success ]; then
            echo "::error::Review the intent-repairs artifact. Apply mechanical.patch first; assess example-suggestions.patch separately. Resolve remaining checks before merging."
            exit 1
          fi
