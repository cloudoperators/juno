name: CI Check ✅

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - changeset-release/main

permissions:
  contents: read

env:
  HUSKY: 0
  NODE_VERSION: "26.13.0"

jobs:
  reuse-compliance:
    name: reuse
    runs-on: [ubuntu-latest]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: REUSE Compliance Check
        run: pipx run reuse lint

  license-headers:
    name: license-headers
    runs-on: [ubuntu-latest]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check license headers
        run: |
          go install github.com/apache/skywalking-eyes/cmd/license-eye@v0.9.0
          "$(go env GOPATH)/bin/license-eye" -c .github/licenserc.yaml header check

  cache-dependencies:
    runs-on: [ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm via Corepack
        run: |
          corepack enable
          corepack prepare --activate
        shell: bash

      - name: Get pnpm store directory
        id: pnpm-cache
        run: |
          echo "pnpm_cache_dir=$(pnpm store path)" >> $GITHUB_OUTPUT

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        name: Setup pnpm cache
        with:
          path: ${{ steps.pnpm-cache.outputs.pnpm_cache_dir }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

  checks:
    needs: cache-dependencies
    runs-on: [ubuntu-latest]
    strategy:
      # matrix.command is executed verbatim via `run:` — keep these values
      # static/in-repo; never source them from event or external input.
      matrix:
        include:
          - title: "license-check"
            command: "pnpm run check-licenses"
          - title: "lint-check"
            command: "pnpm lint"
          - title: "type-check"
            command: "pnpm run typecheck"
          - title: "format-check"
            command: "pnpm run check-format --check '**/*.{js,jsx,ts,tsx}'"
          - title: "dependency-pinning-check"
            command: "node .github/scripts/check-pinned-dependencies.js"
          - title: "tests"
            command: "pnpm build && pnpm run test"

    name: ${{ matrix.title }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm via Corepack
        run: |
          corepack enable
          corepack prepare --activate
        shell: bash

      - name: Get pnpm store directory
        id: pnpm-cache
        run: |
          echo "pnpm_cache_dir=$(pnpm store path)" >> $GITHUB_OUTPUT

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        name: Setup pnpm cache
        with:
          path: ${{ steps.pnpm-cache.outputs.pnpm_cache_dir }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run "${{ matrix.command }}" command
        run: ${{ matrix.command }}

  e2e-smoke:
    runs-on: [ubuntu-latest]
    name: e2e-smoke
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm via Corepack
        run: |
          corepack enable
          corepack prepare --activate
        shell: bash

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Run e2e smoke test
        run: pnpm --filter @cloudoperators/create-greenhouse-plugin test:e2e
