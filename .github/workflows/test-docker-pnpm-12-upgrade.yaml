# Test workflow to verify Docker builds work with pnpm@11.25.0 in Dockerfiles
# while the monorepo uses pnpm@12.4.2

name: Test Docker Multi-Arch with pnpm 12 Monorepo

on:
  pull_request:
    branches:
      - main
    paths:
      - 'apps/supernova/docker/Dockerfile'
      - 'apps/greenhouse/docker/Dockerfile'
      - 'package.json'
      - '.github/workflows/test-docker-pnpm-12-upgrade.yaml'
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_SUPERNOVA: "juno-app-supernova-test"
  IMAGE_NAME_GREENHOUSE: "juno-app-greenhouse-test"

jobs:
  test-docker-builds:
    name: Test Multi-Arch Builds with pnpm 12 Monorepo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify versions
        run: |
          echo "=== Monorepo pnpm version ==="
          grep "packageManager" package.json
          echo ""
          echo "=== Supernova Dockerfile pnpm version ==="
          grep "pnpm@" apps/supernova/docker/Dockerfile
          echo ""
          echo "=== Greenhouse Dockerfile pnpm version ==="
          grep "pnpm@" apps/greenhouse/docker/Dockerfile

      # Add support for more platforms with QEMU
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      # Set up BuildKit Docker container builder
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          driver-opts: |
            image=moby/buildkit:latest

      # Build supernova for both platforms
      - name: Build Supernova - both platforms
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/supernova/docker/Dockerfile
          push: false
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME_SUPERNOVA }}:test
          platforms: |
            linux/amd64
            linux/arm64
          outputs: type=image,push=false

      # Build greenhouse for amd64 only (it doesn't have arm64 in prod workflow)
      - name: Build Greenhouse - amd64 only
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/greenhouse/docker/Dockerfile
          push: false
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME_GREENHOUSE }}:test
          platforms: linux/amd64
          outputs: type=image,push=false

      - name: Build result
        if: success()
        run: |
          echo "✅ Success! Docker builds work with:"
          echo "  - Monorepo using pnpm 12.4.2"
          echo "  - Dockerfiles pinned to pnpm@11.25.0"
          echo "  - Multi-arch builds (amd64 + arm64) succeed without QEMU segfaults"

      - name: Build failed
        if: failure()
        run: |
          echo "❌ Build failed!"
          echo "This means the Dockerfile pnpm pinning may not be sufficient."
