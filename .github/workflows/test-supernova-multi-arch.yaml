# Test workflow to verify multi-arch builds work with pinned pnpm version
# This validates the fix for QEMU segfaults on arm64 builds

name: Test Supernova Multi-Arch Build

on:
  pull_request:
    branches:
      - main
    paths:
      - 'apps/supernova/docker/Dockerfile'
      - 'apps/greenhouse/docker/Dockerfile'
      - '.github/workflows/test-supernova-multi-arch.yaml'
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: "juno-app-supernova-test"
  PACKAGE_PATH: "apps/supernova"

jobs:
  test-multi-arch-build:
    name: Test Multi-Arch Build (amd64 + arm64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify pnpm version in Dockerfile
        run: |
          echo "Checking pnpm version in Dockerfile..."
          grep "pnpm@11.25.0" apps/supernova/docker/Dockerfile

      # Add support for more platforms with QEMU
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      # Set up BuildKit Docker container builder
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          driver-opts: |
            image=moby/buildkit:latest

      # Build both platforms (DO NOT PUSH)
      - name: Build Docker image - both platforms
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ env.PACKAGE_PATH }}/docker/Dockerfile
          push: false
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:test
          platforms: |
            linux/amd64
            linux/arm64
          outputs: type=image,push=false

      - name: Build result
        if: success()
        run: |
          echo "✅ Multi-arch build succeeded with pinned pnpm@11.25.0!"
          echo "This confirms the fix for QEMU segfaults on arm64 builds."

      - name: Build failed
        if: failure()
        run: |
          echo "❌ Multi-arch build failed!"
          echo "The pnpm version pinning may not be working correctly."
