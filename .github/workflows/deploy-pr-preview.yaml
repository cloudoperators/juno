# Run it locally with act
#  1. Install act:
#     `brew install act`
#  2. Create a .secret file with the following content:
#     `GITHUB_TOKEN=your_github_token`
#  PULL REQUEST
#  1. Create a act_pull_request.json file in case of a pull request with the following content:
#     `{"pull_request": {"number": <PR number>, "head": {"ref": "<PR branch name>", "sha": "PR commit sha"}, "base": {"ref": "main"}}, "repository": {"name": "juno", "owner": {"login": "cloudoperators"}}}`
#  2. Run the following command:
#     `act pull_request --container-architecture linux/amd64 -P default=catthehacker/ubuntu:act-latest -e act_pull_request.json -W .github/workflows/deploy-pr-preview.yaml`

name: PR Preview Deployment 🚀

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed
      - labeled

# Limit the concurrency of entire workflow
concurrency: deploy-pr-preview-${{ github.ref }}

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pull-requests: write

env:
  DEPLOY_PATH: tmp
  NODE_VERSION: "26.13.0"
  PREVIEW_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/pr-preview/pr-${{ github.event.pull_request.number }}

jobs:
  check-preview-label:
    # Check if preview label is present
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      has-preview-label: ${{ steps.check-label.outputs.result }}
    steps:
      - name: Check for preview label
        id: check-label
        run: |
          if [[ "${{ contains(github.event.pull_request.labels.*.name, 'ui-pr-preview') }}" == "true" ]]; then
            echo "result=true" >> $GITHUB_OUTPUT
          else
            echo "result=false" >> $GITHUB_OUTPUT
          fi

  run-detect-changes:
    # skip if the PR is from a forked repository
    if: github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/shared-detect-pkg-changes.yaml
    with:
      paths: "packages apps"
      runs-on: ubuntu-latest

  build-deploy:
    # Only run if: (files changed in ui-components/template OR label present) OR PR is being closed for cleanup
    if: |
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action == 'closed' ||
       contains(needs.run-detect-changes.outputs.changes, 'ui-components') ||
       contains(needs.run-detect-changes.outputs.changes, 'apps/template') ||
       needs.check-preview-label.outputs.has-preview-label == 'true')
    needs: [check-preview-label, run-detect-changes]
    runs-on: [ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Precompile ENVs
        if: github.event.action != 'closed'
        id: compile-envs
        run: |
          # setup ENVs for each app to preview
          # Build if either files changed OR preview label is present
          echo "IS_STORYBOOK_CHANGED=${{ contains(needs.run-detect-changes.outputs.changes, 'ui-components') || needs.check-preview-label.outputs.has-preview-label == 'true' }}" >> $GITHUB_ENV
          echo "IS_TEMPLATE_CHANGED=${{ contains(needs.run-detect-changes.outputs.changes, 'apps/template') || needs.check-preview-label.outputs.has-preview-label == 'true' }}" >> $GITHUB_ENV

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: github.event.action != 'closed'
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm via Corepack
        if: github.event.action != 'closed'
        run: |
          corepack enable
          corepack prepare --activate
        shell: bash

      - name: Get pnpm store directory
        if: github.event.action != 'closed'
        id: pnpm-cache
        run: |
          echo "pnpm_cache_dir=$(pnpm store path)" >> $GITHUB_OUTPUT

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event.action != 'closed'
        name: Setup pnpm cache
        with:
          path: ${{ steps.pnpm-cache.outputs.pnpm_cache_dir }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        if: github.event.action != 'closed'
        run: pnpm install --frozen-lockfile

      - name: Create a folder with all compiled apps and pkgs
        if: github.event.action != 'closed'
        run: |
          mkdir -p ${{ env.DEPLOY_PATH }}

      - name: Build STORYBOOK if changes detected
        id: build-storybook
        if: github.event.action != 'closed' && env.IS_STORYBOOK_CHANGED == 'true'
        run: |
          pnpm --filter @cloudoperators/juno-ui-components run build-storybook
          cp -r ${{ env.PACKAGE_PATH }}/storybook-static ${{ env.DEPLOY_PATH }}/${{ env.TARGET_FOLDER }}
        env:
          PACKAGE_PATH: packages/ui-components
          TARGET_FOLDER: storybook
        continue-on-error: true

      - name: Build TEMPLATE if changes detected
        id: build-template
        if: github.event.action != 'closed' && env.IS_TEMPLATE_CHANGED == 'true'
        run: ./.github/scripts/build-vite-app.sh
        env:
          PACKAGE_PATH: apps/template
          TARGET_FOLDER: template
        continue-on-error: true

      - name: Generate index.html for Deployed Apps
        if: github.event.action != 'closed'
        env:
          STORYBOOK_OUTCOME: "${{ steps.build-storybook.outcome }}"
          TEMPLATE_OUTCOME: "${{ steps.build-template.outcome }}"
        run: |
          echo "<!DOCTYPE html><head><title>PR Preview</title></head><html><body><h1>Deployed Packages for PR ${GITHUB_HEAD_REF}</h1><ul>" > ${{ env.DEPLOY_PATH }}/index.html

          # components name should map to the IS_<component>_CHANGED
          COMPONENTS=("storybook" "template")

          for component in "${COMPONENTS[@]}"; do
            CHANGED_VAR="IS_${component^^}_CHANGED"  # Make it uppercase for the env var
            CHANGED="${!CHANGED_VAR}"  # Get the value of the environment variable

            if [ "$CHANGED" = "true" ]; then
              OUTCOME_VAR="${component^^}_OUTCOME"  # Make it uppercase for the env var
              echo "==OUTCOME_VAR=="
              echo $OUTCOME_VAR
              echo "==="
              BUILD_OUTCOME="${!OUTCOME_VAR}"  # Get the value of the environment variable
              echo "==BUILD_OUTCOME=="
              echo $BUILD_OUTCOME
              echo "==="
              if [ "$BUILD_OUTCOME" == "success" ]; then
                echo "<li><a href='./${component}/index.html' target="_blank">${component^} <span style='color:green;'>✓ Success</span></a></li>" >> ${{ env.DEPLOY_PATH }}/index.html
              else
                echo "<li>${component^} <span style='color:red;'>✗ Failed</span></li>" >> ${{ env.DEPLOY_PATH }}/index.html
              fi
            fi
          done

          echo "</ul></body></html>" >> ${{ env.DEPLOY_PATH }}/index.html

      - name: Deploy preview to gh-pages
        if: github.event.action != 'closed'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SOURCE_DIR: ${{ env.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          target="pr-preview/pr-${PR_NUMBER}"
          worktree="$(mktemp -d)"
          git fetch origin gh-pages || true
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git worktree add "$worktree" origin/gh-pages
          else
            git worktree add --orphan -b gh-pages "$worktree"
          fi
          rm -rf "${worktree:?}/${target}"
          mkdir -p "${worktree}/${target}"
          cp -r "${SOURCE_DIR}/." "${worktree}/${target}/"
          git -C "$worktree" add --all
          if git -C "$worktree" diff --cached --quiet; then
            echo "No preview changes to publish."
          else
            git -C "$worktree" commit -m "Deploy preview for PR #${PR_NUMBER}"
            git -C "$worktree" push origin gh-pages
          fi
          git worktree remove --force "$worktree"

      - name: Remove preview from gh-pages
        if: github.event.action == 'closed'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages || exit 0
          git show-ref --verify --quiet refs/remotes/origin/gh-pages || exit 0
          target="pr-preview/pr-${PR_NUMBER}"
          worktree="$(mktemp -d)"
          git worktree add "$worktree" origin/gh-pages
          if [ -d "${worktree}/${target}" ]; then
            git -C "$worktree" rm -r "${target}"
            git -C "$worktree" commit -m "Remove preview for PR #${PR_NUMBER}"
            git -C "$worktree" push origin gh-pages
          fi
          git worktree remove --force "$worktree"

      - name: Comment preview link
        if: github.event.action != 'closed'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v8.0.0
        env:
          PREVIEW_URL: ${{ env.PREVIEW_URL }}
        with:
          script: |
            const marker = "<!-- pr-preview-comment -->"
            const body = `${marker}\n🔍 PR preview deployed: ${process.env.PREVIEW_URL}/`
            const { owner, repo } = context.repo
            const issue_number = context.payload.pull_request.number
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            })
            const existing = comments.find((comment) => comment.body && comment.body.includes(marker))
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body })
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body })
            }
