packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  '@swc/core': set this to true or false
  esbuild: set this to true or false
  msw: set this to true or false
minimumReleaseAgeExclude:
  - postcss@8.5.18
  - brace-expansion@5.0.8
overrides:
  brace-expansion@<=5.0.7: ^5.0.8
  postcss@<=8.5.17: ^8.5.18
